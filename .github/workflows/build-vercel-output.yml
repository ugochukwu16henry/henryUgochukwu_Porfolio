# Vercel deploys the committed henry-s-digital-studio-main/.vercel/output as-is.
# This workflow rebuilds it on Linux after every push to main (code or
# dashboard data) and commits the result, which Vercel then deploys.
name: Build Vercel output

on:
  push:
    branches: [main]
    paths:
      - "henry-s-digital-studio-main/**"
      - "!henry-s-digital-studio-main/.vercel/output/**"
      - ".github/workflows/build-vercel-output.yml"
  workflow_dispatch:

concurrency:
  group: build-vercel-output
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: henry-s-digital-studio-main
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: rm -rf .vercel/output && bun run build
        env:
          NITRO_PRESET: vercel

      - name: Commit rebuilt output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .vercel/output
          if git diff --cached --quiet; then
            echo "Build output unchanged; nothing to deploy."
            exit 0
          fi
          git commit -m "chore: rebuild Vercel output for ${GITHUB_SHA::7}"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
